name: Build Boiler Plant FMU

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/boiler/BoilerPlant.mo
      - bacnet-simulator/src/model_runtime/models/boiler/model.json
      - bacnet-simulator/src/model_runtime/models/boiler/tests/**
      - bacnet-simulator/src/model_runtime/shared/build-fmu.sh
      - bacnet-simulator/src/model_runtime/shared/validate_fmu_metadata.py
      - bacnet-simulator/Dockerfile
      - .github/workflows/build-boiler-fmu.yml
  workflow_dispatch:
    inputs:
      run_extended:
        description: "Also run the extended boiler test suite (slower sweeps/stability/step-response tests)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: boiler-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build BoilerPlant.fmu and run regression tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build Boiler Plant FMU
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MODELICA_BUILD_IMAGE" \
            sh -c "mkdir -p /fmu-out && cp models/boiler/BoilerPlant.mo /build/BoilerPlant.mo && MODELICA_FILE=BoilerPlant.mo MODELICA_MODEL=BoilerPlant FMU_OUTPUT_NAME=BoilerPlant.fmu sh shared/build-fmu.sh && cp /fmu-out/BoilerPlant.fmu models/boiler/BoilerPlant.fmu"

      - name: Validate & sync Boiler Plant FMU metadata
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu models/boiler/BoilerPlant.fmu \
            --metadata models/boiler/model.json \
            --fix

      - name: Build test runtime image
        working-directory: bacnet-simulator
        run: docker build --target model-runtime --pull --progress=plain -t model-runtime:ci -f Dockerfile .

      - name: Run Boiler Plant core regression tests
        working-directory: bacnet-simulator
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/src/model_runtime:/app/model_runtime" -w /app/model_runtime model-runtime:ci \
            sh -c "pip install --quiet pytest && python -m pytest models/boiler/tests -m core -v" \
            | tee boiler-core-test.log

      - name: Run Boiler Plant extended regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_extended == true
        working-directory: bacnet-simulator
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/src/model_runtime:/app/model_runtime" -w /app/model_runtime model-runtime:ci \
            sh -c "pip install --quiet pytest && python -m pytest models/boiler/tests -m extended -v" \
            | tee boiler-extended-test.log

      - name: Write test summary
        if: always()
        working-directory: bacnet-simulator
        run: |
          {
            echo "# Boiler Plant Regression Tests"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | BoilerPlant |"
            echo "| FMU | model_runtime/models/boiler/BoilerPlant.fmu |"
            echo "| FMI mode | Model Exchange |"
            echo "| Test suite | Core$([ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.run_extended }}' = 'true' ] && echo ' + Extended') |"
            if [ -f boiler-core-test.log ] && tail -n 5 boiler-core-test.log | grep -q "passed"; then
              echo "| Result | PASS |"
            else
              echo "| Result | FAIL |"
            fi
            echo
            echo "## Core suite"
            echo '```'
            tail -n 15 boiler-core-test.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            if [ -f boiler-extended-test.log ]; then
              echo
              echo "## Extended suite"
              echo '```'
              tail -n 15 boiler-extended-test.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated Boiler Plant FMU
        run: |
          git add models/boiler/BoilerPlant.fmu models/boiler/model.json

          if git diff --cached --quiet -- models/boiler/BoilerPlant.fmu models/boiler/model.json; then
            echo "No Boiler Plant FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build BoilerPlant FMU [skip ci]"

          # This repo has several other FMU-build workflows that also
          # commit-and-push their own model's FMU back to the same branch,
          # several sharing trigger paths (shared/build-fmu.sh,
          # shared/validate_fmu_metadata.py) with this one -- a push
          # touching one of those files fires multiple such jobs
          # concurrently, and only the first to push wins; the rest see
          # "fetch first" since origin/main moved under them. Retry with a
          # rebase rather than fail outright: the conflicting commits touch
          # different files (different models' FMUs), so a rebase applies
          # cleanly in the normal case. (Same fix already applied to
          # build-ahu-v2-fmu.yml after hitting this exact race in practice.)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing onto origin/$GITHUB_REF_NAME."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push models/boiler/BoilerPlant.fmu and model.json after 5 attempts."
          exit 1
