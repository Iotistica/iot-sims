name: Build AHU v2 FMU (experimental)

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/ahu/AHU.mo
      - bacnet-simulator/src/model_runtime/models/ahu/model.json
      - bacnet-simulator/src/model_runtime/models/ahu/tests/**
      - bacnet-simulator/src/model_runtime/shared/build-fmu.sh
      - bacnet-simulator/src/model_runtime/shared/validate_fmu_metadata.py
      - bacnet-simulator/Dockerfile
      - .github/workflows/build-ahu-v2-fmu.yml
  workflow_dispatch:
    inputs:
      run_extended:
        description: "Also run the extended AHU test suite (slower sweeps/stability/regression tests)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: ahu-v2-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build AHU.fmu and run regression tests
    runs-on: ubuntu-24.04
    # Only the FMU-compile/validate/commit steps below run from bacnet-simulator/src/model_runtime --
    # the runtime-image build/test steps override to bacnet-simulator/ itself, since Dockerfile
    # lives there (shared with the BACnet simulator) rather than inside model_runtime.
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build AHU v2 FMU
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MODELICA_BUILD_IMAGE" \
            sh -c "mkdir -p /fmu-out && cp models/ahu/AHU.mo /build/AHU.mo && MODELICA_FILE=AHU.mo MODELICA_MODEL=AHU FMU_OUTPUT_NAME=AHU.fmu sh shared/build-fmu.sh && cp /fmu-out/AHU.fmu models/ahu/AHU.fmu"

      - name: Validate & sync AHU FMU metadata
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu models/ahu/AHU.fmu \
            --metadata models/ahu/model.json \
            --fix

      - name: Build test runtime image
        working-directory: bacnet-simulator
        run: docker build --target model-runtime --pull --progress=plain -t model-runtime:ci -f Dockerfile .

      - name: Run AHU core regression tests
        working-directory: bacnet-simulator
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/src/model_runtime:/app/model_runtime" -w /app/model_runtime model-runtime:ci \
            sh -c "pip install --quiet pytest && python -m pytest models/ahu/tests -m core -v" \
            | tee ahu-core-test.log

      - name: Run AHU extended regression tests
        if: github.event_name == 'workflow_dispatch' && inputs.run_extended == true
        working-directory: bacnet-simulator
        run: |
          set -o pipefail
          docker run --rm -v "$PWD/src/model_runtime:/app/model_runtime" -w /app/model_runtime model-runtime:ci \
            sh -c "pip install --quiet pytest && python -m pytest models/ahu/tests -m extended -v" \
            | tee ahu-extended-test.log

      - name: Write test summary
        if: always()
        working-directory: bacnet-simulator
        run: |
          {
            echo "# AHU Regression Tests"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Model | AHU |"
            echo "| FMU | model_runtime/models/ahu/AHU.fmu |"
            echo "| FMI mode | Model Exchange |"
            echo "| Test suite | Core$([ '${{ github.event_name }}' = 'workflow_dispatch' ] && [ '${{ inputs.run_extended }}' = 'true' ] && echo ' + Extended') |"
            if [ -f ahu-core-test.log ] && tail -n 5 ahu-core-test.log | grep -q "passed"; then
              echo "| Result | PASS |"
            else
              echo "| Result | FAIL |"
            fi
            echo
            echo "## Core suite"
            echo '```'
            tail -n 15 ahu-core-test.log 2>/dev/null || echo "(no log captured)"
            echo '```'
            if [ -f ahu-extended-test.log ]; then
              echo
              echo "## Extended suite"
              echo '```'
              tail -n 15 ahu-extended-test.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated AHU v2 FMU
        run: |
          git add models/ahu/AHU.fmu models/ahu/model.json

          if git diff --cached --quiet -- models/ahu/AHU.fmu models/ahu/model.json; then
            echo "No AHU v2 FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build AHU (v2) FMU [skip ci]"

          # This repo has several other FMU-build workflows that also
          # commit-and-push their own model's FMU back to the same branch
          # (build-ahu-fmu.yml, build-zone-fmu.yml, build-vav-fmu.yml, ...),
          # some sharing trigger paths (shared/build-fmu.sh,
          # shared/validate_fmu_metadata.py) with this one. A push touching
          # one of those files fires multiple such jobs concurrently; each
          # commits its own unrelated file, but only the first to push wins
          # -- the rest see "fetch first" since origin/main moved under
          # them. Retry with a rebase rather than fail outright: the
          # conflicting commits touch different files (different models'
          # FMUs), so a rebase applies cleanly in the normal case.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- fetching and rebasing onto origin/$GITHUB_REF_NAME."
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push models/ahu/AHU.fmu and model.json after 5 attempts."
          exit 1
