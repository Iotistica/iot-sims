name: Build AHU FMU

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/ahu-simple/**/*.mo
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: ahu-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build SimpleAHU.fmu
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build AHU FMU
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MODELICA_BUILD_IMAGE" \
            sh -c "mkdir -p /fmu-out && cp models/ahu-simple/SimpleAHU.mo /build/SimpleAHU.mo && MODELICA_FILE=SimpleAHU.mo MODELICA_MODEL=SimpleAHU FMU_OUTPUT_NAME=SimpleAHU.fmu sh shared/build-fmu.sh && cp /fmu-out/SimpleAHU.fmu models/ahu-simple/SimpleAHU.fmu"

      - name: Validate & sync AHU FMU metadata
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu models/ahu-simple/SimpleAHU.fmu \
            --metadata models/ahu-simple/model.json \
            --fix

      - name: Commit generated AHU FMU
        run: |
          git add models/ahu-simple/SimpleAHU.fmu models/ahu-simple/model.json

          if git diff --cached --quiet -- models/ahu-simple/SimpleAHU.fmu models/ahu-simple/model.json; then
            echo "No AHU FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build SimpleAHU FMU [skip ci]"
          git push
