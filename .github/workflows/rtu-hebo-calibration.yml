name: RTU HEBO Calibration

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'HEBO evaluation budget'
        required: false
        default: '100'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RTU_FMU: models/rtu/RTU.fmu
  RTU_METADATA: models/rtu/model.json
  RTU_HISTORY_CSV: models/rtu/calibration/rtu1_history.csv
  RTU_HEBO_JSON: models/rtu/calibration/rtu1_hebo_calibration.json

concurrency:
  group: rtu-hebo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  calibrate:
    name: HEBO-calibrate RTU FMU
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify RTU HEBO calibration inputs
        run: |
          test -f "$RTU_FMU" || {
            echo "RTU FMU not found: $RTU_FMU"
            exit 1
          }

          test -f "$RTU_METADATA" || {
            echo "RTU metadata not found: $RTU_METADATA"
            exit 1
          }

          test -f "$RTU_HISTORY_CSV" || {
            echo "RTU history dataset not found: $RTU_HISTORY_CSV"
            exit 1
          }

          test -f shared/validate_fmu_metadata.py || {
            echo "Missing shared/validate_fmu_metadata.py"
            exit 1
          }

          test -f shared/run_hebo_calibration.py || {
            echo "Missing shared/run_hebo_calibration.py"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bacnet-simulator/src/model_runtime/requirements-hebo.txt

      - name: Install HEBO calibration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-hebo.txt

      - name: Validate RTU calibration contract
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu "$RTU_FMU" \
            --metadata "$RTU_METADATA" \
            --validate-calibration

      - name: Run HEBO calibration
        run: |
          python shared/run_hebo_calibration.py \
            --fmu "$RTU_FMU" \
            --metadata "$RTU_METADATA" \
            --data "$RTU_HISTORY_CSV" \
            --output "$RTU_HEBO_JSON" \
            --iterations "${{ inputs.iterations || '100' }}"

      - name: Write HEBO calibration summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          hebo_path = Path(os.environ["RTU_HEBO_JSON"])
          metadata_path = Path(os.environ["RTU_METADATA"])
          history_path = Path(os.environ["RTU_HISTORY_CSV"])
          fmu_path = Path(os.environ["RTU_FMU"])

          lines = []
          lines.append("# RTU HEBO Calibration")
          lines.append("")
          lines.append("Inspired by Martinez-Viol et al., Building and Environment 226 (2022) 109693.")
          lines.append("")
          lines.append("## Run inputs")
          lines.append("")
          lines.append("| Item | Value |")
          lines.append("|---|---|")
          lines.append(f"| FMU | `{fmu_path}` |")
          lines.append(f"| Metadata | `{metadata_path}` |")
          lines.append(f"| Historical data | `{history_path}` |")
          lines.append(f"| HEBO result | `{hebo_path}` |")
          lines.append("")

          if hebo_path.exists():
              try:
                  data = json.loads(hebo_path.read_text())
                  goal = data.get("goal", {})
                  optimizer = data.get("optimizer", {})
                  baseline = data.get("baseline") or {}
                  best = data.get("best", {})
                  failures = data.get("failures", {})

                  lines.append("## Configuration")
                  lines.append("")
                  lines.append("| Setting | Value |")
                  lines.append("|---|---|")
                  lines.append(f"| Model | `{data.get('model', 'unknown')}` |")
                  lines.append(f"| Goal | `{goal.get('metadata_output', 'unknown')}` |")
                  lines.append(f"| Metric | `{goal.get('metric', 'unknown')}` |")
                  lines.append(f"| Optimizer | `{optimizer.get('method', 'unknown')}` |")
                  lines.append(f"| FMI execution | `{optimizer.get('fmi_type', 'unknown')}` / `{optimizer.get('solver', 'unknown')}` |")
                  lines.append(f"| Iterations requested | {optimizer.get('iterations_requested', '')} |")
                  lines.append(f"| Evaluations completed | {optimizer.get('evaluations_completed', '')} |")
                  lines.append("")

                  lines.append("## Calibration results")
                  lines.append("")
                  lines.append("| Result | Value |")
                  lines.append("|---|---:|")
                  baseline_objective = baseline.get("objective") if baseline else None
                  lines.append(f"| Baseline objective | {baseline_objective if baseline_objective is not None else 'n/a'} |")
                  lines.append(f"| Best objective | {best.get('objective', '')} |")
                  improvement_pct = best.get("improvement_pct")
                  if isinstance(improvement_pct, (int, float)):
                      lines.append(f"| Improvement % | {improvement_pct:.3f}% |")
                  else:
                      lines.append(f"| Improvement % | {improvement_pct if improvement_pct is not None else 'n/a'} |")
                  lines.append(f"| Failed simulations | {failures.get('count', 0)}/{optimizer.get('evaluations_completed', '')} ({failures.get('rate_pct', 0):.1f}%) |")
                  lines.append("")

                  best_params = best.get("parameters") or {}
                  if best_params:
                      lines.append("### Best parameter set")
                      lines.append("")
                      lines.append("| Parameter | Value |")
                      lines.append("|---|---:|")
                      for k, v in best_params.items():
                          lines.append(f"| `{k}` | {v} |")
                      lines.append("")
              except Exception as exc:
                  lines.append(f"> Could not parse HEBO calibration result: `{exc}`")
                  lines.append("")
          else:
              lines.append("## Calibration results")
              lines.append("")
              lines.append("> HEBO calibration result was not generated.")
              lines.append("")

          summary_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit RTU HEBO calibration results
        run: |
          git add "$RTU_HEBO_JSON"

          if git diff --cached --quiet -- "$RTU_HEBO_JSON"; then
            echo "No RTU HEBO calibration result changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update RTU HEBO calibration results [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- another sensitivity/calibration workflow likely pushed its own results concurrently. Rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Failed to push RTU HEBO calibration results after 5 attempts."
          exit 1
