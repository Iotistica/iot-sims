name: Build Chiller FMU

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/chiller/**/*.mo
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: chiller-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build SimpleChillerPlant.fmu
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build Chiller FMU
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MODELICA_BUILD_IMAGE" \
            sh -c "mkdir -p /fmu-out && cp models/chiller/SimpleChillerPlant.mo /build/SimpleChillerPlant.mo && MODELICA_FILE=SimpleChillerPlant.mo MODELICA_MODEL=SimpleChillerPlant FMU_OUTPUT_NAME=SimpleChillerPlant.fmu sh shared/build-fmu.sh && cp /fmu-out/SimpleChillerPlant.fmu models/chiller/SimpleChillerPlant.fmu"

      - name: Commit generated Chiller FMU
        run: |
          git add models/chiller/SimpleChillerPlant.fmu

          if git diff --cached --quiet -- models/chiller/SimpleChillerPlant.fmu; then
            echo "No Chiller FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build SimpleChillerPlant FMU [skip ci]"
          git push
