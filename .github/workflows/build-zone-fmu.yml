name: Build Zone FMU

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/zone/**/*.mo
      - bacnet-simulator/src/model_runtime/models/zone/model.json
      - bacnet-simulator/src/model_runtime/shared/build-fmu.sh
      - bacnet-simulator/src/model_runtime/shared/validate_fmu_metadata.py
      - .github/workflows/build-zone-fmu.yml
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: zone-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build ThermalZone.fmu
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build Zone FMU
        run: |
          docker run --rm             -v "$PWD:/work"             -w /work             "$MODELICA_BUILD_IMAGE"             sh -c "mkdir -p /fmu-out &&               cp models/zone/ThermalZone.mo /build/ThermalZone.mo &&               MODELICA_FILE=ThermalZone.mo               MODELICA_MODEL=ThermalZone               FMU_OUTPUT_NAME=ThermalZone.fmu               sh shared/build-fmu.sh &&               cp /fmu-out/ThermalZone.fmu models/zone/ThermalZone.fmu"

      - name: Validate & sync Zone FMU metadata
        run: |
          python shared/validate_fmu_metadata.py             --fmu models/zone/ThermalZone.fmu             --metadata models/zone/model.json             --fix             --validate-calibration

      - name: Commit generated Zone FMU
        run: |
          git add             models/zone/ThermalZone.fmu             models/zone/model.json

          if git diff --cached --quiet --             models/zone/ThermalZone.fmu             models/zone/model.json; then
            echo "No Zone FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build ThermalZone FMU [skip ci]"
          git push
