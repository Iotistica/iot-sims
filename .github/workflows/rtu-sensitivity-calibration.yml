name: RTU Sensitivity & Calibration

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RTU_FMU: models/rtu/RTU.fmu
  RTU_METADATA: models/rtu/model.json
  RTU_HISTORY_CSV: models/rtu/calibration/rtu1_history.csv
  RTU_SENSITIVITY_JSON: models/rtu/calibration/rtu1_sensitivity.json
  RTU_CALIBRATION_JSON: models/rtu/calibration/rtu1_calibration.json

concurrency:
  group: rtu-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze RTU FMU
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify RTU analysis inputs
        run: |
          test -f "$RTU_FMU" || {
            echo "RTU FMU not found: $RTU_FMU"
            exit 1
          }

          test -f "$RTU_METADATA" || {
            echo "RTU metadata not found: $RTU_METADATA"
            exit 1
          }

          test -f "$RTU_HISTORY_CSV" || {
            echo "RTU history dataset not found: $RTU_HISTORY_CSV"
            echo "Expected CSV columns:"
            echo "timestamp,supply_air_temp_setpoint_c,outdoor_air_temp_c,return_air_temp_c,fan_command_pct,most_open_vav_damper_pct,minimum_outdoor_air_damper_pct,supply_air_temp_c"
            exit 1
          }

          test -f shared/validate_fmu_metadata.py || {
            echo "Missing shared/validate_fmu_metadata.py"
            exit 1
          }

          test -f shared/run_sensitivity.py || {
            echo "Missing shared/run_sensitivity.py"
            exit 1
          }

          test -f shared/run_calibration.py || {
            echo "Missing shared/run_calibration.py"
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: bacnet-simulator/src/model_runtime/requirements-analysis.txt

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-analysis.txt

      - name: Validate RTU calibration contract
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu "$RTU_FMU" \
            --metadata "$RTU_METADATA" \
            --validate-calibration

      - name: Run Morris sensitivity analysis
        run: |
          python shared/run_sensitivity.py \
            --fmu "$RTU_FMU" \
            --metadata "$RTU_METADATA" \
            --data "$RTU_HISTORY_CSV" \
            --output "$RTU_SENSITIVITY_JSON"

      - name: Run Differential Evolution calibration
        run: |
          python shared/run_calibration.py \
            --fmu "$RTU_FMU" \
            --metadata "$RTU_METADATA" \
            --data "$RTU_HISTORY_CSV" \
            --sensitivity "$RTU_SENSITIVITY_JSON" \
            --output "$RTU_CALIBRATION_JSON"

      - name: Write analysis summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          sensitivity_path = Path(os.environ["RTU_SENSITIVITY_JSON"])
          calibration_path = Path(os.environ["RTU_CALIBRATION_JSON"])
          metadata_path = Path(os.environ["RTU_METADATA"])
          history_path = Path(os.environ["RTU_HISTORY_CSV"])
          fmu_path = Path(os.environ["RTU_FMU"])

          lines = []
          lines.append("# RTU Sensitivity & Calibration")
          lines.append("")
          lines.append("## Run inputs")
          lines.append("")
          lines.append("| Item | Value |")
          lines.append("|---|---|")
          lines.append(f"| FMU | `{fmu_path}` |")
          lines.append(f"| Metadata | `{metadata_path}` |")
          lines.append(f"| Historical data | `{history_path}` |")
          lines.append(f"| Sensitivity result | `{sensitivity_path}` |")
          lines.append(f"| Calibration result | `{calibration_path}` |")
          lines.append("")

          if metadata_path.exists():
              try:
                  metadata = json.loads(metadata_path.read_text())
                  cal = metadata.get("calibration", {})
                  goal = cal.get("goal", {})
                  sens = cal.get("sensitivity", {})
                  opt = cal.get("optimizer", {})

                  lines.append("## Configuration")
                  lines.append("")
                  lines.append("| Setting | Value |")
                  lines.append("|---|---|")
                  lines.append(f"| Model | `{metadata.get('id', 'unknown')}` |")
                  lines.append(f"| Goal | `{goal.get('output', goal.get('variable', 'unknown'))}` |")
                  lines.append(f"| Metric | `{goal.get('metric', cal.get('metric', 'unknown'))}` |")
                  lines.append(f"| Sensitivity method | `{sens.get('method', 'unknown')}` |")
                  lines.append(f"| Morris trajectories | `{sens.get('trajectories', 'unknown')}` |")
                  lines.append(f"| Morris grid levels | `{sens.get('grid_levels', 'unknown')}` |")
                  lines.append(f"| Sensitivity measure | `{sens.get('measure', 'unknown')}` |")
                  lines.append(f"| Optimizer | `{opt.get('method', 'unknown')}` |")
                  lines.append("")

                  tuners = cal.get("tuners") or []
                  if tuners:
                      lines.append("### Tuner bounds")
                      lines.append("")
                      lines.append("| Parameter | Initial | Min | Max | Unit |")
                      lines.append("|---|---:|---:|---:|---|")
                      for t in tuners:
                          lines.append(
                              f"| `{t.get('parameter', '')}` | "
                              f"{t.get('initial', '')} | "
                              f"{t.get('min', '')} | "
                              f"{t.get('max', '')} | "
                              f"{t.get('unit', '')} |"
                          )
                      lines.append("")
              except Exception as exc:
                  lines.append(f"> Could not parse metadata: `{exc}`")
                  lines.append("")

          if sensitivity_path.exists():
              try:
                  data = json.loads(sensitivity_path.read_text())
                  hist = data.get("historical_period", {})
                  sens = data.get("sensitivity", {})
                  score = sens.get("score_summary", {})

                  lines.append("## Morris sensitivity results")
                  lines.append("")
                  lines.append("| Run detail | Value |")
                  lines.append("|---|---:|")
                  lines.append(f"| Historical samples | {hist.get('samples', '')} |")
                  lines.append(f"| Historical duration (s) | {hist.get('duration_seconds', '')} |")
                  lines.append(f"| Warmup excluded (s) | {hist.get('warmup_seconds_excluded_from_metric', '')} |")
                  lines.append(f"| FMU evaluations | {sens.get('fmu_evaluations', '')} |")
                  lines.append(f"| Min score | {score.get('min', '')} |")
                  lines.append(f"| Mean score | {score.get('mean', '')} |")
                  lines.append(f"| Max score | {score.get('max', '')} |")
                  lines.append("")

                  results = sens.get("results") or []
                  if results:
                      lines.append("### Parameter ranking")
                      lines.append("")
                      lines.append("| Rank | Parameter | μ | μ* | σ | μ* conf. |")
                      lines.append("|---:|---|---:|---:|---:|---:|")
                      for r in results:
                          lines.append(
                              f"| {r.get('rank', '')} | `{r.get('parameter', '')}` | "
                              f"{r.get('mu', '')} | {r.get('mu_star', '')} | "
                              f"{r.get('sigma', '')} | {r.get('mu_star_conf', '')} |"
                          )
                      lines.append("")
              except Exception as exc:
                  lines.append(f"> Could not parse sensitivity result: `{exc}`")
                  lines.append("")
          else:
              lines.append("## Morris sensitivity results")
              lines.append("")
              lines.append("> Sensitivity result was not generated.")
              lines.append("")

          if calibration_path.exists():
              try:
                  data = json.loads(calibration_path.read_text())
                  result = data.get("result", {})
                  optimizer = data.get("optimizer", {})

                  lines.append("## Calibration results")
                  lines.append("")
                  lines.append("| Result | Value |")
                  lines.append("|---|---:|")
                  lines.append(f"| Success | `{result.get('success', '')}` |")
                  lines.append(f"| Message | {result.get('message', '')} |")
                  lines.append(f"| Iterations | {result.get('iterations', '')} |")
                  lines.append(f"| Evaluations | {result.get('evaluations', '')} |")
                  lines.append(f"| Baseline score | {result.get('baseline_score', '')} |")
                  lines.append(f"| Best score | {result.get('best_score', '')} |")
                  lines.append(f"| Improvement | {result.get('improvement', '')} |")
                  improvement_pct = result.get("improvement_pct")
                  if isinstance(improvement_pct, (int, float)):
                      lines.append(f"| Improvement % | {improvement_pct:.3f}% |")
                  else:
                      lines.append(f"| Improvement % | {improvement_pct or ''} |")
                  lines.append(f"| Optimizer | `{optimizer.get('method', '')}` |")
                  lines.append("")

                  params = result.get("parameters") or []
                  if params:
                      lines.append("### Calibrated parameters")
                      lines.append("")
                      lines.append("| Parameter | Initial | Calibrated | Min | Max | Unit |")
                      lines.append("|---|---:|---:|---:|---:|---|")
                      for p in params:
                          lines.append(
                              f"| `{p.get('parameter', '')}` | "
                              f"{p.get('initial', '')} | "
                              f"{p.get('calibrated', '')} | "
                              f"{p.get('min', '')} | "
                              f"{p.get('max', '')} | "
                              f"{p.get('unit', '')} |"
                          )
                      lines.append("")
              except Exception as exc:
                  lines.append(f"> Could not parse calibration result: `{exc}`")
                  lines.append("")
          else:
              lines.append("## Calibration results")
              lines.append("")
              lines.append("> Calibration result was not generated.")
              lines.append("")

          summary_path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit RTU analysis results
        run: |
          git add \
            "$RTU_SENSITIVITY_JSON" \
            "$RTU_CALIBRATION_JSON"

          if git diff --cached --quiet -- \
            "$RTU_SENSITIVITY_JSON" \
            "$RTU_CALIBRATION_JSON"; then
            echo "No RTU analysis result changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update RTU sensitivity and calibration results [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) -- another sensitivity/calibration workflow likely pushed its own results concurrently. Rebasing onto origin/main and retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::Failed to push RTU analysis results after 5 attempts."
          exit 1
