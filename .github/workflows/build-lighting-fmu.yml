name: Build Lighting FMU

on:
  push:
    branches:
      - main
      - feature/**
    paths:
      - bacnet-simulator/src/model_runtime/models/lighting/**/*.mo
      - bacnet-simulator/src/model_runtime/models/lighting/model.json
      - bacnet-simulator/src/model_runtime/shared/validate_fmu_metadata.py
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  MODELICA_BUILD_IMAGE: iotistic/modelica-build:om-1.27.0-buildings-13.0.0

concurrency:
  group: lighting-fmu-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build LightingZone.fmu
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bacnet-simulator/src/model_runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 15); do
            docker info > /dev/null 2>&1 && echo "Docker daemon ready" && break
            echo "Waiting for Docker daemon... ($i/15)"
            sleep 2
          done
          docker info

      - name: Build Lighting FMU
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            "$MODELICA_BUILD_IMAGE" \
            sh -c "mkdir -p /fmu-out && \
              cp models/lighting/LightingZone.mo /build/LightingZone.mo && \
              MODELICA_FILE=LightingZone.mo \
              MODELICA_MODEL=LightingZone \
              FMU_OUTPUT_NAME=LightingZone.fmu \
              sh shared/build-fmu.sh && \
              cp /fmu-out/LightingZone.fmu models/lighting/LightingZone.fmu"

      - name: Validate & sync Lighting FMU metadata
        run: |
          python shared/validate_fmu_metadata.py \
            --fmu models/lighting/LightingZone.fmu \
            --metadata models/lighting/model.json \
            --fix

      - name: Commit generated Lighting FMU
        run: |
          git add models/lighting/LightingZone.fmu models/lighting/model.json

          if git diff --cached --quiet -- models/lighting/LightingZone.fmu models/lighting/model.json; then
            echo "No Lighting FMU changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build LightingZone FMU [skip ci]"
          git push
